name: Deploiement GitHub Pages

# Chaque push sur main reconstruit le site et le publie sur GitHub Pages.
# Le declenchement manuel permet de republier sans commit.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Un seul deploiement a la fois. On ne coupe pas un deploiement en cours :
# l'interrompre laisserait le site dans un etat indetermine.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  construire:
    name: Construire
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v7

      - name: Installer Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Installer les dependances
        run: npm ci

      # Garde-fous : un depot casse ne doit jamais atteindre la production.
      - name: Valider la banque de questions
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Construire le site
        run: npm run build

      - name: Configurer Pages
        uses: actions/configure-pages@v6

      - name: Televerser l'artefact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deployer:
    name: Publier
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Deployer sur Pages
        id: deploiement
        uses: actions/deploy-pages@v5

      # Verification post-deploiement : sans elle, un echec silencieux
      # passerait inapercu. Le domaine et son certificat etant desormais
      # etablis, un echec ici doit faire echouer le build.
      - name: Verifier que le site repond
        run: |
          for tentative in 1 2 3 4 5; do
            echo "Tentative $tentative..."
            code=$(curl -sSL -o page.html -w '%{http_code}' --max-time 20 https://dragonballquiz.com/ || echo 000)
            if [ "$code" = "200" ] && grep -q "Dragon Ball Quiz" page.html; then
              echo "Site en ligne et contenu attendu present."
              exit 0
            fi
            echo "Reponse HTTP $code, nouvelle tentative dans 20 s."
            sleep 20
          done
          echo "::error::Le site ne repond pas correctement apres le deploiement."
          exit 1

      - name: Verifier les images de partage
        run: |
          for langue in fr en; do
            reponse=$(curl -sSL -o /dev/null -w '%{http_code} %{content_type}' --max-time 20 "https://dragonballquiz.com/og/$langue.png" || echo 000)
            echo "og/$langue.png : $reponse"
            case "$reponse" in
              "200 image/png"*) ;;
              *) echo "::error::Image de partage og/$langue.png indisponible."; exit 1 ;;
            esac
          done
